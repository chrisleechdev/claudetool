rules:
  - id: discourage-time-since
    message: |
      Consider using `clock.Since(ctx, t)` instead of `time.Since(t)` to make your code more testable and deterministic.

      The clock library allows tests to mock time using `clock.SetMockTime()`, making tests more reliable.

      It may be that you're using this to capture performance metrics, in which case you could probably ignore this finding.

      Please check out:

      https://godoc.tools.prod.prod-ffs.io/pkg/github.com/monzo/wearedev/libraries/clock/

      (If this error is in your terminal you can ⌘ + double click the link to open it in your browser)
    severity: INFO
    languages: [go]
    pattern: time.Since($T)
    fix: clock.Since(ctx, $T)
    paths:
      include:
        - "*.go"
      exclude:
        - "*_test.go"
        - "**/libraries/clock/*"
